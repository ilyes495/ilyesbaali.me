<svg color="#1b1b1f" viewBox="0 0 640 282" width="100%" role="img" aria-label="Two approaches compared. Predicting absolute expression requires the model to reproduce the target cell type itself as well as the perturbation. Predicting only the change and applying it to real control cells from the target context means the cell type is supplied by the data." style="max-width:640px">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="14" width="624" height="112" rx="10" fill="currentColor" opacity="0.028"/>
  <text x="26" y="38" font-size="11.5" font-weight="700" fill="currentColor" opacity="0.75">THE TEMPTING WAY</text>
  <text x="26" y="56" font-size="10.5" fill="currentColor" opacity="0.6">predict the perturbed profile outright</text>
  <rect x="26" y="72" width="112" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.6"/>
  <text x="82" y="93" font-size="10.5" text-anchor="middle" fill="currentColor">model</text>
  <line x1="142" y1="89" x2="196" y2="89" stroke="currentColor" stroke-width="1.3" opacity="0.6" marker-end="url(#ar)"/>
  <rect x="202" y="72" width="150" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.6"/>
  <text x="277" y="93" font-size="10.5" text-anchor="middle" fill="currentColor">absolute expression</text>
  <text x="374" y="84" font-size="10.5" fill="currentColor" opacity="0.75">must get the cell type right</text>
  <text x="374" y="100" font-size="10.5" fill="currentColor" opacity="0.75">AND the perturbation</text>
  <rect x="8" y="140" width="624" height="128" rx="10" fill="#2563eb" opacity="0.045"/>
  <text x="26" y="164" font-size="11.5" font-weight="700" fill="#2563eb">THE BETTER WAY</text>
  <text x="26" y="182" font-size="10.5" fill="currentColor" opacity="0.6">predict only the change, and start from real cells</text>
  <rect x="26" y="198" width="126" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.6"/>
  <text x="89" y="216" font-size="10.5" text-anchor="middle" fill="currentColor">real resting cells</text>
  <text x="89" y="232" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">from this context</text>
  <text x="168" y="226" font-size="15" fill="currentColor" opacity="0.7">&#215;</text>
  <rect x="190" y="198" width="126" height="46" rx="6" fill="none" stroke="#2563eb" stroke-width="1.3" opacity="0.8"/>
  <text x="253" y="216" font-size="10.5" text-anchor="middle" fill="#2563eb">fold change</text>
  <text x="253" y="232" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">measured elsewhere</text>
  <line x1="322" y1="221" x2="376" y2="221" stroke="#2563eb" stroke-width="1.3" opacity="0.8" marker-end="url(#arb)"/>
  <rect x="382" y="198" width="126" height="46" rx="6" fill="none" stroke="#2563eb" stroke-width="1.3" opacity="0.8"/>
  <text x="445" y="216" font-size="10.5" text-anchor="middle" fill="#2563eb">predicted cells</text>
  <text x="445" y="232" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">resampled counts</text>
  <text x="524" y="210" font-size="10.5" fill="currentColor" opacity="0.8">the cell type comes</text>
  <text x="524" y="225" font-size="10.5" fill="currentColor" opacity="0.8">free, from the data</text>
</svg>
