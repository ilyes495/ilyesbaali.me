<svg xmlns="http://www.w3.org/2000/svg" color="#1b1b1f" viewBox="0 0 640 417" width="100%" role="img" aria-label="Two grids. Rows are cell types, columns are perturbations, and each square is the transcriptome response of one perturbation in one cell type. In 2025 a single cell type has its control and most perturbations measured, with a few left to predict. In 2026 three new cell types have only their control measured, and every perturbation in every one of them must be predicted." style="max-width:640px">
  <defs>
    <rect id="sq" width="20" height="20" rx="3"/>
    <rect id="sqo" width="20" height="20" rx="3" fill="none" stroke-width="1.4" stroke-dasharray="3 2.5"/>
  </defs>

  <text x="16" y="22" font-size="11" font-weight="700" fill="currentColor" opacity="0.55" letter-spacing="0.5">EACH SQUARE = ONE PERTURBATION&#8217;S EFFECT, IN ONE CELL TYPE</text>

  <text x="16" y="56" font-size="13" font-weight="700" fill="currentColor">2025</text>
  <text x="16" y="72" font-size="10.5" fill="currentColor" opacity="0.6">interpolation</text>
  <text x="196" y="96" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">control</text>
  <text x="196" y="108" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">cells</text>
  <path d="M256 104 L256 98 L448 98 L448 104" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="352" y="92" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">300 perturbations &#8212; one gene knocked down in each</text>
  <text x="180" y="128" font-size="10.5" text-anchor="end" fill="currentColor">H1 stem cells</text>
  <g fill="currentColor" opacity="0.5"><use href="#sq" x="186" y="114"/></g>
  <g fill="currentColor" opacity="0.5">
    <use href="#sq" x="256" y="114"/><use href="#sq" x="280" y="114"/><use href="#sq" x="304" y="114"/>
    <use href="#sq" x="328" y="114"/><use href="#sq" x="352" y="114"/><use href="#sq" x="376" y="114"/>
  </g>
  <g stroke="currentColor" opacity="0.6"><use href="#sqo" x="400" y="114"/><use href="#sqo" x="424" y="114"/></g>
  <text x="466" y="128" font-size="10.5" fill="currentColor" opacity="0.75">predict these two</text>

  <line x1="16" y1="186" x2="624" y2="186" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="16" y="216" font-size="13" font-weight="700" fill="currentColor">2026</text>
  <text x="16" y="232" font-size="10.5" fill="currentColor" opacity="0.6">transfer</text>
  <text x="196" y="256" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">control</text>
  <text x="196" y="268" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">cells</text>
  <path d="M256 264 L256 258 L448 258 L448 264" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="352" y="252" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.75">the same 300 perturbations</text>
  <text x="180" y="288" font-size="10.5" text-anchor="end" fill="#2563eb" font-weight="600">cell type A</text>
  <text x="180" y="312" font-size="10.5" text-anchor="end" fill="#d55e00" font-weight="600">cell type B</text>
  <text x="180" y="336" font-size="10.5" text-anchor="end" fill="#009e73" font-weight="600">cell type C</text>
  <g opacity="0.75">
    <use href="#sq" x="186" y="274" fill="#2563eb"/>
    <use href="#sq" x="186" y="298" fill="#d55e00"/>
    <use href="#sq" x="186" y="322" fill="#009e73"/>
  </g>
  <g stroke="#2563eb" opacity="0.7"><use href="#sqo" x="256" y="274"/><use href="#sqo" x="280" y="274"/><use href="#sqo" x="304" y="274"/><use href="#sqo" x="328" y="274"/><use href="#sqo" x="352" y="274"/><use href="#sqo" x="376" y="274"/><use href="#sqo" x="400" y="274"/><use href="#sqo" x="424" y="274"/></g>
  <g stroke="#d55e00" opacity="0.7"><use href="#sqo" x="256" y="298"/><use href="#sqo" x="280" y="298"/><use href="#sqo" x="304" y="298"/><use href="#sqo" x="328" y="298"/><use href="#sqo" x="352" y="298"/><use href="#sqo" x="376" y="298"/><use href="#sqo" x="400" y="298"/><use href="#sqo" x="424" y="298"/></g>
  <g stroke="#009e73" opacity="0.7"><use href="#sqo" x="256" y="322"/><use href="#sqo" x="280" y="322"/><use href="#sqo" x="304" y="322"/><use href="#sqo" x="328" y="322"/><use href="#sqo" x="352" y="322"/><use href="#sqo" x="376" y="322"/><use href="#sqo" x="400" y="322"/><use href="#sqo" x="424" y="322"/></g>
  <text x="466" y="306" font-size="10.5" fill="currentColor" opacity="0.85">predict every one</text>

  <g font-size="10.5">
    <g fill="currentColor" opacity="0.5"><use href="#sq" x="16" y="382"/></g>
    <text x="44" y="396" fill="currentColor" opacity="0.8">measured &#8212; real cells you are given</text>
    <g fill="none" stroke="currentColor" opacity="0.6"><use href="#sqo" x="286" y="382"/></g>
    <text x="314" y="396" fill="currentColor" opacity="0.8">to predict &#8212; cells you must generate</text>
  </g>
</svg>
