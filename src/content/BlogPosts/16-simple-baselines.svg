<svg xmlns="http://www.w3.org/2000/svg" color="#1b1b1f" viewBox="0 0 640 226" width="100%" role="img" aria-label="Scores of three simple approaches on a scale where zero is a generic average response and one is a repeat of the experiment. Submitting four hundred identical cells scores far below zero. A simple transfer baseline scores just above zero, leaving most of the distance to a replicate unclaimed." style="max-width:640px">
  <text x="20" y="26" font-size="12" font-weight="600" fill="currentColor">Where simple approaches land</text>
  <text x="20" y="43" font-size="10.5" fill="currentColor" opacity="0.65">0 = a generic average response for everything &#183; 1 = a repeat of the real experiment</text>
  <line x1="25" y1="196" x2="612" y2="196" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="278" y1="62" x2="278" y2="196" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="278" y="212" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">0</text>
  <line x1="590" y1="62" x2="590" y2="196" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.45"/>
  <text x="590" y="212" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">1</text>
  <text x="590" y="58" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">replicate</text>
  <rect x="25" y="70" width="253" height="22" rx="3" fill="currentColor" opacity="0.30"/>
  <text x="146" y="86" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.95">&#8722;0.81</text>
  <text x="20" y="112" font-size="10.5" fill="currentColor" opacity="0.8">400 identical cells carrying the average profile</text>
  <rect x="276" y="128" width="4" height="22" rx="1" fill="currentColor" opacity="0.55"/>
  <text x="288" y="144" font-size="10.5" fill="currentColor" opacity="0.8">the generic baseline itself &#8212; predict one average response</text>
  <rect x="278" y="164" width="20" height="22" rx="3" fill="#2563eb" opacity="0.8"/>
  <text x="306" y="180" font-size="10.5" fill="#2563eb">a first transfer baseline, applied to real control cells</text>
</svg>
