<svg xmlns="http://www.w3.org/2000/svg" color="#1b1b1f" viewBox="0 0 640 286" width="100%" role="img" aria-label="A curve showing what fraction of cells detect a gene as a function of how strongly that gene is expressed. Genes at one count per million are seen in under three percent of cells; only above one hundred CPM are they seen in most cells." style="max-width:640px">
  <text x="20" y="26" font-size="12" font-weight="600" fill="currentColor">A gene can be ON and still absent from most cells</text>
  <text x="20" y="42" font-size="10.5" fill="currentColor" opacity="0.65">fraction of cells in which a gene is detected at all, against how strongly it is expressed</text>
  <line x1="78" y1="236" x2="600" y2="236" stroke="currentColor" stroke-width="0.6" opacity="0.1"/>
  <text x="70" y="240" font-size="9.5" text-anchor="end" fill="currentColor" opacity="0.65">0%</text>
  <line x1="78" y1="190" x2="600" y2="190" stroke="currentColor" stroke-width="0.6" opacity="0.1"/>
  <text x="70" y="194" font-size="9.5" text-anchor="end" fill="currentColor" opacity="0.65">25%</text>
  <line x1="78" y1="145" x2="600" y2="145" stroke="currentColor" stroke-width="0.6" opacity="0.1"/>
  <text x="70" y="149" font-size="9.5" text-anchor="end" fill="currentColor" opacity="0.65">50%</text>
  <line x1="78" y1="100" x2="600" y2="100" stroke="currentColor" stroke-width="0.6" opacity="0.1"/>
  <text x="70" y="104" font-size="9.5" text-anchor="end" fill="currentColor" opacity="0.65">75%</text>
  <line x1="78" y1="54" x2="600" y2="54" stroke="currentColor" stroke-width="0.6" opacity="0.1"/>
  <text x="70" y="58" font-size="9.5" text-anchor="end" fill="currentColor" opacity="0.65">100%</text>
  <polyline points="78.0,236.0 92.1,236.0 106.2,236.0 120.3,235.9 134.4,235.9 148.5,235.8 162.6,235.8 176.8,235.7 190.9,235.5 205.0,235.4 219.1,235.2 233.2,234.8 247.3,234.4 261.4,233.8 275.5,233.0 289.6,232.0 303.7,230.5 317.8,228.7 331.9,225.9 346.1,222.4 360.2,218.1 374.3,212.0 388.4,204.3 402.5,194.6 416.6,182.7 430.7,168.6 444.8,151.9 458.9,134.1 473.0,116.6 487.1,100.1 501.2,86.0 515.4,75.0 529.5,66.7 543.6,61.7 557.7,58.7 571.8,56.4 585.9,55.5 600.0,55.3" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="283" y1="232" x2="283" y2="236" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35"/>
  <circle cx="283" cy="232" r="4" fill="#2563eb"/>
  <text x="283" y="222" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.9">2%</text>
  <text x="283" y="252" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.65">1 CPM</text>
  <line x1="357" y1="219" x2="357" y2="236" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35"/>
  <circle cx="357" cy="219" r="4" fill="#2563eb"/>
  <text x="357" y="209" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.9">9%</text>
  <text x="357" y="252" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.65">5 CPM</text>
  <line x1="420" y1="179" x2="420" y2="236" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35"/>
