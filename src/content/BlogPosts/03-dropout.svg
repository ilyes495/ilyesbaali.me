  <text x="420" y="169" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.9">31%</text>
  <text x="420" y="252" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.65">20 CPM</text>
  <line x1="494" y1="93" x2="494" y2="236" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35"/>
  <circle cx="494" cy="93" r="4" fill="#2563eb"/>
  <text x="494" y="83" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.9">79%</text>
  <text x="494" y="252" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.65">100 CPM</text>
