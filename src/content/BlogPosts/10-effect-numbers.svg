<svg xmlns="http://www.w3.org/2000/svg" font-family="Charter, 'Bitstream Charter', XCharter, 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif" color="#1b1b1f" viewBox="0 0 640 288" width="100%" role="img" aria-label="A flow diagram. Two populations of cells, control and perturbed, both feed into a step that averages each population gene by gene. That feeds into a step that divides the two averages and takes a log, giving one number per gene. A worked example below takes a gene from an average of 100 down to 50, a ratio of 0.5, which is minus one on a log2 scale." style="max-width:640px">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="eb" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
  <text x="20" y="24" font-size="12" font-weight="600" fill="currentColor">Where the effect numbers come from</text>
  <text x="20" y="40" font-size="10.5" fill="currentColor" opacity="0.65">two populations of cells in, one number per gene out</text>

  <rect x="20" y="58" width="146" height="52" rx="6" fill="currentColor" opacity="0.06"/>
  <text x="93" y="80" font-size="10.5" text-anchor="middle" fill="currentColor" font-weight="600">control cells</text>
  <text x="93" y="96" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">nothing knocked down</text>
  <rect x="20" y="124" width="146" height="52" rx="6" fill="#2563eb" opacity="0.08"/>
  <text x="93" y="146" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="600">perturbed cells</text>
  <text x="93" y="162" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">one gene knocked down</text>
  <text x="93" y="192" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">hundreds of cells each</text>

  <path d="M166 84 H196 V104 H222" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.6" marker-end="url(#ea)"/>
  <path d="M166 150 H196 V130 H222" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.6" marker-end="url(#ea)"/>

  <rect x="228" y="82" width="150" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
  <text x="303" y="106" font-size="10.5" text-anchor="middle" fill="currentColor">average each one,</text>
  <text x="303" y="122" font-size="10.5" text-anchor="middle" fill="currentColor">gene by gene</text>
  <text x="303" y="140" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">pooling is what makes it stable</text>

  <path d="M378 117 H414" fill="none" stroke="#2563eb" stroke-width="1.3" opacity="0.8" marker-end="url(#eb)"/>

  <rect x="420" y="82" width="196" height="70" rx="6" fill="#2563eb" opacity="0.07" stroke="#2563eb" stroke-width="1.2"/>
  <text x="518" y="106" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="600">one number per gene</text>
  <text x="518" y="124" font-size="10.5" text-anchor="middle" fill="currentColor">divide, then take a log</text>
  <text x="518" y="142" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.65">0 means the gene did not move</text>

  <rect x="20" y="212" width="596" height="62" rx="6" fill="currentColor" opacity="0.035"/>
  <text x="34" y="232" font-size="9" font-weight="700" fill="currentColor" opacity="0.6">WORKED EXAMPLE, FOR ONE GENE</text>
  <text x="34" y="254" font-size="11" fill="currentColor">control average 100</text>
  <text x="180" y="254" font-size="11" fill="currentColor">perturbed average 50</text>
  <text x="338" y="254" font-size="11" fill="currentColor">ratio 50/100 = 0.5</text>
  <text x="474" y="254" font-size="11" fill="#2563eb" font-weight="700">log2(0.5) = &#8722;1</text>
  <text x="34" y="268" font-size="9.5" fill="currentColor" opacity="0.65">a log scale so that doubling (+1) and halving (&#8722;1) come out equal and opposite</text>
</svg>
